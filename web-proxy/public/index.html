<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Proxy</title>
<style>
  :root {
    --bg: #f6f6f8;
    --surface: #ffffff;
    --fg: #1c1c1e;
    --muted: #6b6b70;
    --line: #d5d5da;
    --accent: #2f6fde;
    --accent-fg: #ffffff;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121214;
      --surface: #1e1e20;
      --fg: #f2f2f4;
      --muted: #a0a0a6;
      --line: #3a3a3e;
      --accent: #6ea0ff;
      --accent-fg: #0b1220;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { width: 100%; max-width: 36rem; text-align: center; }
  h1 { font-size: 1.75rem; font-weight: 650; margin: 0 0 0.25rem; letter-spacing: -0.01em; }
  p { color: var(--muted); margin: 0 0 1.5rem; }
  form {
    display: flex;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px;
  }
  form:focus-within { border-color: var(--accent); }
  input {
    flex: 1;
    min-width: 0;
    border: 0;
    background: transparent;
    color: var(--fg);
    font: inherit;
    padding: 0 12px;
    outline: none;
  }
  button {
    border: 0;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-fg);
    font: inherit;
    font-weight: 600;
    padding: 10px 20px;
    cursor: pointer;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hint { font-size: 0.875rem; margin-top: 1rem; }
</style>
</head>
<body>
<main>
  <h1>Web Proxy</h1>
  <p>Enter an address, or words to search for.</p>
  <form action="/go" method="get" role="search">
    <input name="url" type="text" placeholder="example.com" aria-label="Address or search" autofocus
           autocomplete="off" autocapitalize="off" spellcheck="false">
    <button type="submit">Go</button>
  </form>
  <p class="hint">While browsing, use the round button in the bottom-right corner to go somewhere else.</p>
</main>
</body>
</html>
